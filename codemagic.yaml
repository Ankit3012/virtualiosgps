workflows:
  ios-unsigned-check:
    name: Virtual GPS - compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Compile for iPhone (unsigned)
        script: |
          xcodebuild \
            -project VirtualGPS.xcodeproj \
            -scheme VirtualGPS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
