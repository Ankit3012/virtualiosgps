
workflows:
  ios-unsigned-check:
    name: Virtual GPS - iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Compile for iPhone
        script: |
          xcodebuild \
            -project VirtualGPS.xcodeproj \
            -scheme VirtualGPS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/VirtualGPS.app ipa/Payload/
          cd ipa
          zip -r ../VirtualGPS-unsigned.ipa Payload

    artifacts:
      - VirtualGPS-unsigned.ipa
